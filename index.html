<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bemerged</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #080a0e;
      }

      body {
        overflow-x: hidden;
        min-height: 100dvh;
      }

      body.bemerged-loading #bemerged-site-host {
        visibility: hidden;
      }

      body.bemerged-loading::before {
        content: 'Loading Bemerged...';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: #080a0e;
        color: #e8eefc;
        font: 600 14px/1.2 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
    </style>
  </head>
  <body class="bemerged-loading">
    <div id="bemerged-site-host"></div>
    <script type="module" src="/src/app/entry.ts"></script>
  </body>
</html>
